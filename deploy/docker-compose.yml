services:
  pg:
    image: postgres:16-alpine
    container_name: slotcar-pg
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 3s
      retries: 20
  ch:
    image: clickhouse/clickhouse-server:24.8
    container_name: slotcar-ch
    environment:
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["9000:9000", "8123:8123"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: slotcar-prom
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9091:9090"]   # host 9090 belongs to slotcar's /metrics
  grafana:
    image: grafana/grafana:11.1.0
    container_name: slotcar-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["3000:3000"]
