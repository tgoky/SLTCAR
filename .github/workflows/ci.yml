name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./... -race -count=1

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: debezium/postgres:16   # wal_level=logical preconfigured
        env: { POSTGRES_USER: demo, POSTGRES_PASSWORD: demo, POSTGRES_DB: demo }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: demo
          CLICKHOUSE_PASSWORD: demo
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["9000:9000", "8123:8123"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8123/ping && exit 0
            sleep 2
          done
          echo "clickhouse did not become ready"; exit 1
      - run: go test -tags integration ./test/integration -v -count=1
